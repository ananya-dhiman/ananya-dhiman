<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 280" width="1200" height="280" role="img" aria-label="Pixel dino running across the desert at night" shape-rendering="crispEdges">
<style>
.f1{animation:l1 .24s steps(1) infinite}
.f2{animation:l2 .24s steps(1) infinite}
@keyframes l1{0%{opacity:1}50%{opacity:0}}
@keyframes l2{0%{opacity:0}50%{opacity:1}}
.jump{animation:jump 3.2s linear infinite}
@keyframes jump{
 0%,70%{transform:translateY(0);animation-timing-function:cubic-bezier(.2,.7,.4,1)}
 78%{transform:translateY(-100px);animation-timing-function:cubic-bezier(.6,0,.8,.3)}
 86%,100%{transform:translateY(0)}}
.cactus{animation:run 3.2s linear infinite}
@keyframes run{from{transform:translateX(1250px)}to{transform:translateX(-100px)}}
.gnd{animation:gnd 2.84s linear infinite}
@keyframes gnd{from{transform:translateX(0)}to{transform:translateX(-1200px)}}
.cld{animation:cld 36s linear infinite}
@keyframes cld{from{transform:translateX(0)}to{transform:translateX(-1200px)}}
.tw{animation-name:tw;animation-iteration-count:infinite;animation-timing-function:steps(1)}
@keyframes tw{50%{opacity:.1}}
</style>
